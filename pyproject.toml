[project]
name = "churn"
version = "1.0.0"
description = "Customer churn prediction with CatBoost, SHAP explanations, a Streamlit app and a FastAPI service."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "catboost>=1.2.7",
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "matplotlib>=3.8",
    "joblib>=1.4",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7"]
app = ["streamlit>=1.38", "plotly>=5.22", "requests>=2.32"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
